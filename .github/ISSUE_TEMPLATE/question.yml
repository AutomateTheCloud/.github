name: Question
description: How something works, or how to use it. Check the README and examples first.
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried
      description: The documentation you read and any configuration you tried. Remove account IDs and secrets.
